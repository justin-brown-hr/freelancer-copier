<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Freelancer Project Copier</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 268px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #12304a;
      background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 2px; }
    p.sub { margin: 0 0 14px; color: #5b7286; font-size: 12px; }
    fieldset { border: 0; margin: 0 0 14px; padding: 0; }
    legend { font-weight: 600; padding: 0 0 6px; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
    input { accent-color: #1197d4; margin: 0; }
    hr { border: 0; border-top: 1px solid #e3eaf0; margin: 14px 0; }
    .hint { color: #5b7286; font-size: 12px; margin: 0; }
    kbd {
      background: #eef2f6; border: 1px solid #d6dfe7; border-bottom-width: 2px;
      border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>Freelancer Project Copier</h1>
  <p class="sub">Open any project page and click the copy icon.</p>

  <fieldset>
    <legend>Copy as</legend>
    <label><input type="radio" name="format" value="text" /> Plain text</label>
    <label><input type="radio" name="format" value="markdown" /> Markdown</label>
    <label><input type="radio" name="format" value="json" /> JSON</label>
  </fieldset>

  <fieldset>
    <legend>Include</legend>
    <label><input type="checkbox" id="includeDescription" /> Full description</label>
  </fieldset>

  <hr />
  <p class="hint">Press <kbd>Alt</kbd> + <kbd>C</kbd> to copy without reaching for the icon.</p>

  <script src="popup.js"></script>
</body>
</html>
